name: Build Tracer for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Download bundled models
        run: |
          python -c "import core; core.download_model('tiny', print); core.download_visual_model(print)"

      - name: Build Tracer
        run: python build.py

      - name: Archive build
        shell: pwsh
        run: Compress-Archive -Path dist/Tracer/* -DestinationPath Tracer-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tracer-Windows
          path: Tracer-Windows.zip
          if-no-files-found: error
          retention-days: 14
